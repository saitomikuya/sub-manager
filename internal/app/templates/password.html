<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · SubManager</title>
  <link rel="stylesheet" href="/admin/static/style.css">
</head>
<body class="auth-page">
  <main class="auth-card wide">
    <div class="brand-mark">SM</div>
    <h1>{{if .MustChange}}首次登录，请修改密码{{else}}修改管理员密码{{end}}</h1>
    <p class="muted">新密码至少 4 位。保存后，其他已登录会话会立即失效。</p>
    {{if .Error}}<div class="alert alert-error">{{.Error}}</div>{{end}}
    <form method="post" action="/admin/password" class="stack">
      <input type="hidden" name="csrf_token" value="{{.CSRF}}">
      {{if not .MustChange}}
      <label>
        <span>当前密码</span>
        <input type="password" name="current_password" required autocomplete="current-password">
      </label>
      {{end}}
      <label>
        <span>新密码</span>
        <input type="password" name="new_password" required minlength="4" maxlength="72" autocomplete="new-password" autofocus>
      </label>
      <label>
        <span>确认新密码</span>
        <input type="password" name="confirm_password" required minlength="4" maxlength="72" autocomplete="new-password">
      </label>
      <button type="submit" class="button primary full">保存新密码</button>
    </form>
  </main>
</body>
</html>
