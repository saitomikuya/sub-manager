services:
  sub-manager:
    build: .
    image: saitomikuya/sub-manager:latest
    container_name: sub-manager
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      BASE_URL: "${BASE_URL:-}"
      COOKIE_SECURE: "${COOKIE_SECURE:-auto}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      FILES_DIR: /data/files
      MAX_UPLOAD_SIZE_MB: "${MAX_UPLOAD_SIZE_MB:-100}"
    volumes:
      - sub_manager_data:/data
      - "${FILES_PATH:-./files}:/data/files"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  sub_manager_data:
    name: sub-manager-data
