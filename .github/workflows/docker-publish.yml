name: Build and publish Docker image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag without the v prefix
        required: true
        default: 1.0.1

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: |
          go test -race -count=1 ./...
          go vet ./...

      - name: Validate release input
        id: release
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          version="$VERSION_INPUT"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN_RELEASE }}

      - name: Preserve the previous release as 1.0.0
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN_RELEASE }}
        run: |
          registry_token="$(curl --fail --silent --show-error --get \
            --user "$DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN" \
            --data-urlencode 'service=registry.docker.io' \
            --data-urlencode 'scope=repository:saitomikuya/sub-manager:pull,push' \
            https://auth.docker.io/token | jq -er '.token // .access_token')"
          accept='application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'
          registry='https://registry-1.docker.io/v2/saitomikuya/sub-manager/manifests'
          if [[ "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $registry_token" -H "Accept: $accept" \
            "$registry/1.0.0")" == 200 ]]; then
            echo "saitomikuya/sub-manager:1.0.0 already exists"
            exit 0
          fi
          release_dir="$(mktemp -d)"
          trap 'rm -rf "$release_dir"' EXIT
          curl --fail --silent --show-error \
            -D "$release_dir/headers" -o "$release_dir/manifest" \
            -H "Authorization: Bearer $registry_token" -H "Accept: $accept" \
            "$registry/latest"
          media_type="$(awk -F': ' 'tolower($1) == "content-type" {gsub("\\r", "", $2); print $2}' "$release_dir/headers" | tail -1)"
          if [[ -z "$media_type" ]]; then
            echo "Unable to resolve the latest manifest media type" >&2
            exit 1
          fi
          curl --fail --silent --show-error --request PUT \
            -H "Authorization: Bearer $registry_token" \
            -H "Content-Type: $media_type" \
            --data-binary "@$release_dir/manifest" \
            "$registry/1.0.0" >/dev/null

      - name: Build and push versioned image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            saitomikuya/sub-manager:${{ steps.release.outputs.version }}
            saitomikuya/sub-manager:sha-${{ steps.release.outputs.short_sha }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify platforms and run the versioned image
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN_RELEASE }}
        run: |
          image="saitomikuya/sub-manager:${{ steps.release.outputs.version }}"
          registry_token="$(curl --fail --silent --show-error --get \
            --user "$DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN" \
            --data-urlencode 'service=registry.docker.io' \
            --data-urlencode 'scope=repository:saitomikuya/sub-manager:pull,push' \
            https://auth.docker.io/token | jq -er '.token // .access_token')"
          accept='application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json'
          registry='https://registry-1.docker.io/v2/saitomikuya/sub-manager/manifests'
          manifest="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $registry_token" -H "Accept: $accept" \
            "$registry/${{ steps.release.outputs.version }}")"
          jq -e 'any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64")' <<<"$manifest" >/dev/null
          jq -e 'any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")' <<<"$manifest" >/dev/null

          docker pull "$image"
          container="sub-manager-release-smoke-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name "$container" \
            --tmpfs /data \
            -p 127.0.0.1:18080:8080 \
            "$image"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done
          curl --silent --output /dev/null \
            -H 'X-Forwarded-For: 203.0.113.10' \
            http://127.0.0.1:18080/not-found
          for attempt in {1..10}; do
            if docker logs "$container" 2>&1 | grep -q 'client_ip=203.0.113.10'; then
              break
            fi
            if [[ "$attempt" == 10 ]]; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done

          if docker run --rm -e TRUSTED_PROXIES=not-an-ip "$image"; then
            echo "Invalid TRUSTED_PROXIES unexpectedly started" >&2
            exit 1
          fi

      - name: Update latest after verification
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN_RELEASE }}
        run: |
          version="${{ steps.release.outputs.version }}"
          registry_token="$(curl --fail --silent --show-error --get \
            --user "$DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN" \
            --data-urlencode 'service=registry.docker.io' \
            --data-urlencode 'scope=repository:saitomikuya/sub-manager:pull,push' \
            https://auth.docker.io/token | jq -er '.token // .access_token')"
          accept='application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'
          registry='https://registry-1.docker.io/v2/saitomikuya/sub-manager/manifests'
          release_dir="$(mktemp -d)"
          trap 'rm -rf "$release_dir"' EXIT
          curl --fail --silent --show-error \
            -D "$release_dir/headers" -o "$release_dir/manifest" \
            -H "Authorization: Bearer $registry_token" -H "Accept: $accept" \
            "$registry/$version"
          media_type="$(awk -F': ' 'tolower($1) == "content-type" {gsub("\\r", "", $2); print $2}' "$release_dir/headers" | tail -1)"
          if [[ -z "$media_type" ]]; then
            echo "Unable to resolve the version manifest media type" >&2
            exit 1
          fi
          curl --fail --silent --show-error --request PUT \
            -H "Authorization: Bearer $registry_token" \
            -H "Content-Type: $media_type" \
            --data-binary "@$release_dir/manifest" \
            "$registry/latest" >/dev/null
          version_digest="$(curl --fail --silent --show-error --head \
            -H "Authorization: Bearer $registry_token" -H "Accept: $accept" \
            "$registry/$version" | awk -F': ' 'tolower($1) == "docker-content-digest" {gsub("\\r", "", $2); print $2}')"
          latest_digest="$(curl --fail --silent --show-error --head \
            -H "Authorization: Bearer $registry_token" -H "Accept: $accept" \
            "$registry/latest" | awk -F': ' 'tolower($1) == "docker-content-digest" {gsub("\\r", "", $2); print $2}')"
          if [[ -z "$version_digest" || "$version_digest" != "$latest_digest" ]]; then
            echo "latest digest does not match the versioned image" >&2
            exit 1
          fi
          {
            echo "## Published image"
            echo
            echo "- Version: \`saitomikuya/sub-manager:$version\`"
            echo "- Latest: \`saitomikuya/sub-manager:latest\`"
            echo "- Digest: \`$version_digest\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"
